# 每次推到 GitHub 自動跑測試（只是檢查，不會改任何東西）
name: 測試
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: pytest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pytest tests -q -p no:cacheprovider > out.txt 2>&1 && rc=0 || rc=$?
          cat out.txt
          echo "::notice title=pytest::$(tail -1 out.txt)"
          exit $rc
