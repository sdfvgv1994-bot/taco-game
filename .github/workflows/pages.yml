# 把 web/ 資料夾放上 GitHub Pages：main 有改到 web/ 就自動更新網站
name: 網頁版上線

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 網址加上版本號（?v=提交代號）：GitHub Pages 讓瀏覽器把檔案存 10 分鐘，
      # 沒有版本號的話，剛更新完有些瀏覽器（例如 Edge）還會用舊的樣式和程式
      - name: 加上版本號
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(style\.css|js/[a-z_]+\.js)\"#\1=\"\2?v=$v\"#g" web/index.html
          grep -c "?v=$v" web/index.html
          # 這一版的代號：App 拿來比對有沒有新版本（version.json），線上對戰比對雙方版本
          sed -i "s#name=\"app-version\" content=\"dev\"#name=\"app-version\" content=\"$v\"#" web/index.html
          grep -c "content=\"$v\"" web/index.html
          printf '{"v":"%s"}\n' "$v" > web/version.json
          # 部署時間（台北時間），顯示在主選單最下面
          sed -i "s#name=\"app-built\" content=\"\"#name=\"app-built\" content=\"$(TZ=Asia/Taipei date '+%m/%d %H:%M')\"#" web/index.html
          # taco 歌單（web/player/）：一樣加版本號、填版本和部署時間
          sed -i -E "s#src=\"(core|app)\.js\"#src=\"\1.js?v=$v\"#g" web/player/index.html
          grep -c "?v=$v" web/player/index.html
          sed -i "s#name=\"app-version\" content=\"dev\"#name=\"app-version\" content=\"$v\"#" web/player/index.html
          sed -i "s#name=\"app-built\" content=\"\"#name=\"app-built\" content=\"$(TZ=Asia/Taipei date '+%m/%d %H:%M')\"#" web/player/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
