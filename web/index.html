<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="dev">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f9fe0">
<link rel="icon" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="taco方塊">
<title>taco方塊對戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Lilita+One&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header>
    <h1 class="logo">TACO BLOCKS<small>taco 方塊對戰</small></h1>
    <div class="top-btns">
      <button id="btn-menu" type="button">主選單</button>
      <button id="btn-pause" type="button">暫停 Esc</button>
      <button id="btn-mute" type="button">靜音 M</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="640" aria-label="遊戲畫面"></canvas>
    <div class="crt"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="touch" id="touch" aria-label="觸控按鍵">
    <button type="button" data-a="left">◀</button>
    <button type="button" data-a="right">▶</button>
    <button type="button" data-a="down">▼</button>
    <button type="button" data-a="cw">轉</button>
    <button type="button" data-a="hold">暫存</button>
    <button type="button" data-a="drop">落下</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/settings.js"></script>
<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/state.js"></script>
<script src="js/panels.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>

</body></html>
