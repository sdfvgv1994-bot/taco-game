<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>taco方塊對戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Lilita+One&family=Silkscreen:wght@400;700&display=swap">
<style>
/* 版面：一台霓虹街機。上方是看板字，中間一個畫布畫所有板子，選單 / 暫停 / 結算都是蓋在畫布上的面板；手機下方多一排觸控鍵 */
:root{
  color-scheme:dark;
  --night:#0b0920;      /* 機台底色 */
  --well:#14112e;       /* 板子底 */
  --grid:#231d4a;       /* 格線 */
  --ink:#ece8ff;        /* 文字 */
  --dim:#9a92c9;        /* 次要文字 */
  --cyan:#3ff2ff;       /* 主霓虹：青 */
  --magenta:#ff3fd0;    /* 副霓虹：洋紅 */
  --amber:#ffc933;      /* 強調：琥珀 */
  --danger:#ff4d6a;
  --f-pixel:"Silkscreen","DotGothic16",monospace;
  --f-text:"DotGothic16","Microsoft JhengHei","PingFang TC",sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-text);
  background-image:radial-gradient(ellipse at 50% -10%,#2a1660 0,transparent 60%),
    linear-gradient(transparent 0 calc(100% - 1px),#ffffff08 0),linear-gradient(90deg,transparent 0 calc(100% - 1px),#ffffff08 0);
  background-size:auto,32px 32px,32px 32px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-pixel);font-weight:700;font-size:clamp(18px,4vw,28px);letter-spacing:.06em;line-height:1;margin:0;
  color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 18px #3ff2ff80,3px 3px 0 var(--magenta)}
.logo small{display:block;font-family:var(--f-text);font-weight:400;font-size:12px;letter-spacing:.2em;color:var(--dim);text-shadow:none;margin-top:6px}
.top-btns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:480px){.top-btns button{padding:5px 8px;font-size:13px}}
button{font:inherit;color:var(--ink);background:#1b1640;border:2px solid #4a3f8f;border-radius:4px;padding:6px 12px;cursor:pointer;
  box-shadow:0 3px 0 #000a}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:active{transform:translateY(2px);box-shadow:none}
.stage{position:relative;flex:1;min-height:0;min-width:0;width:100%;overflow:hidden}
canvas{position:absolute;left:0;top:0;display:block}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000026 2px 3px);mix-blend-mode:multiply}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;background:#0b0920d9;backdrop-filter:blur(2px);z-index:2;padding:12px;box-sizing:border-box;overflow:auto}
.card{margin:auto;width:min(520px,100%);background:#120f2c;border:2px solid var(--magenta);box-shadow:0 0 0 2px #000,0 0 24px #ff3fd055,inset 0 0 24px #ff3fd022;
  padding:20px;display:grid;gap:14px;box-sizing:border-box}
.card h2{margin:0;font-family:var(--f-pixel);font-size:20px;color:var(--amber);text-shadow:0 0 8px #ffc93399;letter-spacing:.05em;text-wrap:balance}
.card p{margin:0;color:var(--dim);line-height:1.6;font-size:14px}
.menu{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.menu button{width:100%;text-align:left;display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:center;padding:10px 12px;font-size:15px}
.menu .k{font-family:var(--f-pixel);color:var(--cyan);text-align:center;border:1px solid #3ff2ff66;border-radius:3px;line-height:1.6}
.menu .t{display:grid;gap:2px;min-width:0}
.menu .t small{color:var(--dim);font-size:12px}
.menu .val{justify-self:end;color:var(--amber);font-family:var(--f-pixel)}
.menu button.setting{grid-template-columns:2.2em 1fr auto}
.hint{font-size:12px;color:var(--dim);text-align:center;line-height:1.7}
.code{font-family:var(--f-pixel);font-size:44px;letter-spacing:.3em;text-align:center;color:var(--amber);text-shadow:0 0 10px #ffc93388}
.field{display:flex;gap:8px}.field input{flex:1;min-width:0;font:inherit;font-size:18px;padding:8px 10px;background:#0b0920;color:var(--ink);border:2px solid #4a3f8f;border-radius:4px}
.field input:focus{outline:2px solid var(--amber)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#9a92c9}.dot.on{background:#45ff8a}
.big{font-family:var(--f-pixel);font-size:34px;color:var(--cyan);text-shadow:0 0 10px var(--cyan),3px 3px 0 var(--magenta);text-align:center}
.touch{display:none;grid-template-columns:repeat(6,1fr);gap:6px}
body.menu-open .touch{visibility:hidden}
.touch button{padding:14px 0;font-size:15px}
.result{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.result th,.result td{padding:6px 8px;border-bottom:1px solid #2c2560;text-align:right}
.result th:first-child,.result td:first-child{text-align:left;color:var(--dim);font-weight:400}
.result thead th{font-family:var(--f-pixel);font-size:13px}
.result tr.key td{background:#ffc93322}
.result tr.key td:first-child{color:var(--amber)}
.result .no{display:inline-block;font-family:var(--f-pixel);font-size:11px;color:#14112e;background:var(--amber);border-radius:3px;padding:0 5px;margin-right:6px}
.why{font-size:15px;color:var(--ink);text-align:center;background:#ffc9331a;border:1px solid #ffc93366;border-radius:4px;padding:8px}
details.how{font-size:13px;color:var(--dim);line-height:1.7}
details.how summary{cursor:pointer;color:var(--cyan)}
.tag{display:inline-block;font-family:var(--f-pixel);font-size:12px;padding:1px 8px;border-radius:3px;margin-top:4px}
.tag.win{background:#45ff8a;color:#06210f}.tag.lose{background:#ff4d6a;color:#2a0610}.tag.draw{background:#9a92c9;color:#14112e}
.keymap{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;font-size:14px}
.keymap .hd{font-family:var(--f-pixel);font-size:12px;color:var(--dim);text-align:center}
.keymap button{min-width:6.5em;padding:6px 8px;font-family:var(--f-pixel);font-size:13px}
.keymap button.wait{border-color:var(--amber);color:var(--amber);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.scroll{overflow-x:auto}
@media (pointer:coarse){.touch{display:grid}}
body.toon{background:#7cc8f0;background-image:radial-gradient(circle at 20% 15%,#ffffff55 0 6%,transparent 7%),radial-gradient(circle at 80% 25%,#ffffff44 0 5%,transparent 6%),linear-gradient(#5db6ea,#a9dcf5)}
body.toon .logo{color:#ffd23f;text-shadow:0 3px 0 #c2410c,0 0 0 #000,3px 5px 0 #1d1d2b}
body.toon .logo small{color:#14304a}
body.toon .crt{display:none}
@media (prefers-reduced-motion:reduce){.crt{display:none}.keymap button.wait{animation:none}}
</style>

<div class="app">
  <header>
    <h1 class="logo">TACO BLOCKS<small>taco 方塊對戰</small></h1>
    <div class="top-btns">
      <button id="btn-menu" type="button">主選單</button>
      <button id="btn-pause" type="button">暫停 Esc</button>
      <button id="btn-mute" type="button">靜音 M</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="640" aria-label="遊戲畫面"></canvas>
    <div class="crt"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="touch" id="touch" aria-label="觸控按鍵">
    <button type="button" data-a="left">◀</button>
    <button type="button" data-a="right">▶</button>
    <button type="button" data-a="down">▼</button>
    <button type="button" data-a="cw">轉</button>
    <button type="button" data-a="hold">暫存</button>
    <button type="button" data-a="drop">落下</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ================= 規則（和 Python 版 engine.py 一樣，另外加上分數） ================= */
const COLS=10, ROWS=20, LOCK_DELAY=.5, LINES_PER_LEVEL=10, MAX_LEVEL=15, MAX_LOCK_RESETS=15, SOFT_INTERVAL=.03, MAX_GARBAGE=8;
const ATTACK=[0,0,1,2,4], COMBO_BONUS=[0,0,1,1,2,2,3,3,4], PERFECT=6, TSPIN_ATTACK=[0,2,4,6], G="G";
const LINE_SCORE=[0,100,300,500,800], TSPIN_SCORE=[400,800,1200,1600], PERFECT_SCORE=3000;  // 分數 × 等級
const ATTACK_GOAL=30;   // 攻擊對戰：先送出幾行垃圾就贏
const BASE={I:[4,[[0,1],[1,1],[2,1],[3,1]]],O:[2,[[0,0],[1,0],[0,1],[1,1]]],T:[3,[[1,0],[0,1],[1,1],[2,1]]],
  S:[3,[[1,0],[2,0],[0,1],[1,1]]],Z:[3,[[0,0],[1,0],[1,1],[2,1]]],J:[3,[[0,0],[0,1],[1,1],[2,1]]],L:[3,[[2,0],[0,1],[1,1],[2,1]]]};
const KINDS=Object.keys(BASE);
const KICKS=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1]];
const SHAPES={};
for(const k of KINDS){const [n,c]=BASE[k];let cells=c;const r=[cells];for(let i=0;i<3;i++){cells=cells.map(([x,y])=>[n-1-y,x]);r.push(cells)}SHAPES[k]=r}
const COLORS={I:"#3ff2ff",O:"#ffd23f",T:"#c25bff",S:"#45ff8a",Z:"#ff4d6a",J:"#4d7bff",L:"#ff9a3f",G:"#5c5880"};
const cellsOf=(k,r,x,y)=>SHAPES[k][((r%4)+4)%4].map(([cx,cy])=>[x+cx,y+cy]);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

class Player{
  constructor(rand){this.rand=rand;this.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));this.bag=[];
    this.queue=[];for(let i=0;i<5;i++)this.queue.push(this.draw());
    Object.assign(this,{hold:null,canHold:true,alive:true,lines:0,combo:-1,b2b:false,pending:[],outbox:0,sent:0,ko:0,deaths:0,
      lastAttacker:null,target:null,done:false,soft:false,event:"",eventAge:9,glow:99,sfx:[],lastRotate:false,pieceNo:0,
      score:0,received:0,maxCombo:0,tetrises:0,tspins:0,pieces:0,shake:0,book:{}});
    this.spawn()}
  draw(){if(!this.bag.length){this.bag=KINDS.slice();for(let i=this.bag.length-1;i>0;i--){const j=Math.floor(this.rand()*(i+1));[this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]]}}return this.bag.pop()}
  spawn(kind){this.pieceNo++;this.kind=kind||this.next();this.rot=0;this.x=Math.floor((COLS-BASE[this.kind][0])/2);this.y=this.kind==="I"?-1:0;
    this.fall=0;this.lockT=0;this.resets=0;if(!this.valid(this.kind,this.rot,this.x,this.y))this.alive=false}
  next(){const k=this.queue.shift();this.queue.push(this.draw());return k}
  valid(k,r,x,y){for(const [cx,cy] of cellsOf(k,r,x,y)){if(cx<0||cx>=COLS||cy>=ROWS)return false;if(cy>=0&&this.grid[cy][cx])return false}return true}
  cells(){return cellsOf(this.kind,this.rot,this.x,this.y)}
  onGround(){return!this.valid(this.kind,this.rot,this.x,this.y+1)}
  ghostY(){let y=this.y;while(this.valid(this.kind,this.rot,this.x,y+1))y++;return y}
  get active(){return this.alive&&!this.done}
  get level(){return Math.floor(this.lines/LINES_PER_LEVEL)+1}
  gravity(){return Math.max(.05,.9*Math.pow(.82,this.level-1))}
  height(){if(this.remote&&this._h!=null)return this._h;const t=this.grid.findIndex(r=>r.some(Boolean));return t<0?0:ROWS-t}
  revive(){this.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));this.pending=[];this.combo=-1;this.b2b=false;this.canHold=true;this.lastAttacker=null;this.alive=true;this.spawn()}
  moved(){if(this.onGround()){if(this.resets<MAX_LOCK_RESETS){this.lockT=0;this.resets++}}else this.lockT=0}
  move(d){if(!this.active||!this.valid(this.kind,this.rot,this.x+d,this.y))return false;this.x+=d;this.lastRotate=false;this.sfx.push("move");this.moved();return true}
  rotate(d){if(!this.active||this.kind==="O")return false;const r=(this.rot+d+4)%4;
    for(const [kx,ky] of KICKS){if(this.valid(this.kind,r,this.x+kx,this.y+ky)){this.rot=r;this.x+=kx;this.y+=ky;this.lastRotate=true;this.sfx.push("rotate");this.moved();return true}}return false}
  doHold(){if(!this.active||!this.canHold)return false;const old=this.hold;this.hold=this.kind;this.spawn(old);this.canHold=false;this.sfx.push("hold");return true}
  hardDrop(){if(!this.active)return;const gy=this.ghostY();if(gy!==this.y)this.lastRotate=false;this.add("hard",2*(gy-this.y),gy-this.y);this.y=gy;this.sfx.push("drop");this.lock()}
  update(dt){this.eventAge+=dt;this.glow+=dt;if(this.koAge!=null)this.koAge+=dt;this.shake=Math.max(0,this.shake-dt);if(!this.active)return;
    if(this.onGround()){this.lockT+=dt;if(this.lockT>=LOCK_DELAY)this.lock();return}
    const iv=this.soft?Math.min(this.gravity(),SOFT_INTERVAL):this.gravity();this.fall+=dt;
    while(this.fall>=iv&&!this.onGround()){this.fall-=iv;this.y++;this.lastRotate=false;if(this.soft)this.add("soft",1)}if(this.onGround())this.fall=0}
  isTspin(){if(this.kind!=="T"||!this.lastRotate)return false;const cx=this.x+1,cy=this.y+1;let f=0;
    for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const x=cx+dx,y=cy+dy;if(x<0||x>=COLS||y>=ROWS||(y>=0&&this.grid[y][x]))f++}return f>=3}
  ev(t){this.event=t;this.eventAge=0}
  add(kind,pts,count=1){if(!pts)return;const b=this.book[kind]||(this.book[kind]={n:0,pts:0});b.n+=count;b.pts+=pts;this.score+=pts}
  lock(){const ts=this.isTspin(),lvl=Math.min(this.level,MAX_LEVEL);this.pieces++;
    for(const [cx,cy] of this.cells()){if(cy<0){this.alive=false;return}this.grid[cy][cx]=this.kind}
    const kept=this.grid.filter(r=>r.some(c=>!c)),n=ROWS-kept.length;
    if(n){this.grid=Array.from({length:n},()=>Array(COLS).fill(null)).concat(kept);this.lines+=n}
    if(ts)this.tspins++;
    if(!n){this.sfx.push(ts?"tspin":"lock");if(ts){this.ev("T 轉！");this.add("tspin0",TSPIN_SCORE[0]*lvl)}this.combo=-1;this.applyGarbage()}
    else{this.combo++;this.maxCombo=Math.max(this.maxCombo,this.combo);if(n===4)this.tetrises++;
      let atk=(ts?TSPIN_ATTACK[n]:ATTACK[n])+COMBO_BONUS[Math.min(this.combo,COMBO_BONUS.length-1)];
      const base=(ts?TSPIN_SCORE[n]:LINE_SCORE[n])*lvl;let bonus=0;
      let label=["","單行","雙行","三行","四行消除！"][n];if(ts)label="T 轉"+label;
      if(n===4||ts){if(this.b2b){atk++;bonus=Math.round(base*.5);label="連續 "+label}this.b2b=true}else this.b2b=false;
      this.add((ts?"tspin":"line")+n,base);this.add("b2b",bonus);this.add("combo",50*this.combo*lvl);
      let perfect=false;if(this.grid.every(r=>r.every(c=>!c))){atk+=PERFECT;this.add("perfect",PERFECT_SCORE*lvl);label="全清！";this.glow=0;perfect=true}
      if(this.combo>=1)label+=` 連擊 x${this.combo}`;this.ev(label);this.sfx.push(perfect?"perfect":ts?"tspin":"clear"+n);
      while(atk&&this.pending.length){const t=Math.min(atk,this.pending[0]);atk-=t;this.pending[0]-=t;if(!this.pending[0])this.pending.shift()}
      this.outbox+=atk;this.sent+=atk}
    this.canHold=true;if(this.alive)this.spawn()}
  receive(n,src){if(n>0){this.pending.push(n);this.received+=n;this.lastAttacker=src;this.sfx.push("warn")}}
  applyGarbage(){let b=MAX_GARBAGE;if(this.pending.length)this.shake=.35;while(this.pending.length&&b){const n=Math.min(this.pending[0],b);b-=n;this.pending[0]-=n;if(!this.pending[0])this.pending.shift();
    const hole=Math.floor(this.rand()*COLS);for(let i=0;i<n;i++){if(this.grid[0].some(Boolean))this.alive=false;const row=Array(COLS).fill(G);row[hole]=null;this.grid=this.grid.slice(1).concat([row])}}}
}

/* 模式：battle（限時 KO）、score（限時比分數）、attack（先送出 30 行）、survival（先頂到頂輸）、sprint、marathon */
class Match{
  constructor(n,mode,timeLimit,seed){seed=seed??Math.floor(Math.random()*2**30);this.players=Array.from({length:n},()=>new Player(rng(seed)));
    Object.assign(this,{mode,timeLimit,elapsed:0,finish:Array(n).fill(null),winner:null,success:null,over:false,shots:[]})}
  get goal(){return this.mode==="sprint"?40:MAX_LEVEL*LINES_PER_LEVEL}
  get timeLeft(){return this.timeLimit?Math.max(0,this.timeLimit-this.elapsed):null}
  get attacks(){return["battle","attack","survival"].includes(this.mode)}
  update(dt){if(this.over)return;if(this.net){netUpdate(this,dt);return}this.elapsed+=dt;this.players.forEach(p=>p.update(dt));this.transfer()}
  hardDrop(i){this.players[i].hardDrop();if(this.net)netAfterLocal(this);else this.transfer()}
  transfer(){if(this.over)return;this.players.forEach((p,i)=>{const o=p.outbox;p.outbox=0;if(o&&this.attacks){const t=this.players.findIndex((q,j)=>j!==i&&q.alive);
      if(t>=0){this.players[t].receive(o,i);this.shots.push({from:i,to:t,n:o,age:0})}}});
    ({battle:this.checkKO,attack:this.checkAttack,score:this.checkScore,survival:this.checkSurvival}[this.mode]||this.checkRace).call(this)}
  end(order){this.over=true;this.ranks=order;const a=this.key(order[0]),b=order[1]!=null?this.key(order[1]):null;this.winner=b&&a.every((v,i)=>v===b[i])?-1:order[0]}
  sortBy(){return this.players.map((_,i)=>i).sort((x,y)=>{const a=this.key(x),b=this.key(y);for(let k=0;k<a.length;k++)if(a[k]!==b[k])return b[k]-a[k];return 0})}
  key(i){const p=this.players[i];return this.mode==="score"?[p.score,p.lines]:this.mode==="attack"?[p.sent,p.ko,-p.height()]:[p.ko,p.sent,-p.height()]}
  knockouts(){this.players.forEach((p,i)=>{if(p.alive)return;p.deaths++;const k=p.lastAttacker;if(k!=null&&k!==i){const a=this.players[k];a.ko++;a.koAge=0;a.ev("KO！");a.sfx.push("ko")}p.ev("被擊倒");p.revive()})}
  timeUp(){return this.timeLimit&&this.elapsed>=this.timeLimit}
  checkKO(){this.knockouts();if(this.timeUp())this.end(this.sortBy())}
  checkAttack(){this.knockouts();if(this.players.some(p=>p.sent>=ATTACK_GOAL)||this.timeUp())this.end(this.sortBy())}
  checkScore(){const alive=this.players.filter(p=>p.alive).length;if(this.timeUp()||alive===0)this.end(this.sortBy())}   // 頂到頂就停在那個分數
  checkSurvival(){const alive=this.players.map((p,i)=>p.alive?i:-1).filter(i=>i>=0);if(alive.length<this.players.length){this.over=true;this.winner=alive.length===1?alive[0]:-1}}
  checkRace(){const p=this.players[0];if(this.finish[0]==null&&p.alive&&p.lines>=this.goal){this.finish[0]=this.elapsed;p.done=true;p.ev("完成！")}
    if(!p.alive||this.finish[0]!=null){this.over=true;this.success=this.finish[0]!=null}}
}

/* ================= 電腦對手（和 ai.py 一樣的評分） ================= */
const DIFFICULTY={"簡單":.40,"普通":.18,"困難":.07};
function evaluate(grid,cells){const b=grid.map(r=>r.slice());for(const [x,y] of cells)if(y>=0)b[y][x]="X";
  const full=b.map((r,i)=>r.every(Boolean)?i:-1).filter(i=>i>=0);let board=b.filter((_,i)=>!full.includes(i));
  board=Array.from({length:full.length},()=>Array(COLS).fill(null)).concat(board);

function star(cx,cy,r,on){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}ctx.closePath();
  ctx.fillStyle=on?"#ffd23f":"#00000055";ctx.fill();ctx.lineWidth=Math.max(1,r/5);ctx.strokeStyle="#1d1d2b";ctx.stroke()}

/* 一位玩家：上方名牌（名字、KO 星星）、左邊暫存與送出行數、中間板子、右邊下一個與分數 */
function drawPlayerSky(p,ox,oy,s,name,color,info){const bw=COLS*s,bh=ROWS*s,side=s*4.6;
  const sx=p.shake>0?Math.sin(p.shake*90)*p.shake*14:0;ox+=sx;const bx=ox+side+14;p._pos={cx:bx+bw/2,cy:oy+bh/2,meterX:bx-8,bottom:oy+bh};
  text(name,bx+bw/2,oy-s*.9,Math.max(13,s*.7),color,"center","toon");
  if(cfg.kind==="battle"||cfg.kind==="attack"){const r=Math.max(5,s*.36);for(let i=0;i<5;i++)star(bx+bw/2+(i-2)*r*2.4,oy-s*2,r,i<p.ko);if(p.ko>5)text(`+${p.ko-5}`,bx+bw/2+3*r*2.4,oy-s*2,Math.max(10,s*.45),"#fff","center","toon")}
  skyBox(ox,oy,side,s*3.6,"Hold");if(p.hold){ctx.globalAlpha=p.canHold?1:.35;mini(p.hold,ox+side/2,oy+s*2.3,s*.7);ctx.globalAlpha=1}
  const vs=match.attacks;const items=[["Score",p.score.toLocaleString()],vs?["Lines Sent",p.sent]:["Line Clears",p.lines],
    cfg.kind==="battle"||cfg.kind==="attack"?["KO",p.ko]:["Level",Math.min(p.level,MAX_LEVEL)]];
  items.forEach(([l,v],i)=>skyBox(ox,oy+s*(4.4+i*3.6),side,s*3,l,String(v)));
  if(p.koAge!=null&&p.koAge<1.6){const k=Math.min(1,p.koAge*5),r=s*1.3*(k<1?k*1.15:1);ctx.save();ctx.globalAlpha=Math.min(1,(1.6-p.koAge)*2);
    ctx.beginPath();ctx.arc(ox+side/2,oy+s*16.6,r,0,Math.PI*2);ctx.fillStyle="#ff4d6a";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();text("KO",ox+side/2,oy+s*16.4,r*.7,"#fff","center","toon");ctx.restore()}
  const inc=Math.min(p.pending.reduce((a,b)=>a+b,0),ROWS);ctx.fillStyle="#ffffff44";ctx.fillRect(bx-11,oy,6,bh);if(inc){ctx.fillStyle="#ff4d6a";ctx.fillRect(bx-11,oy+bh-inc*s,6,inc*s)}
  ctx.fillStyle="#5c8fa8d9";ctx.fillRect(bx,oy,bw,bh);ctx.strokeStyle="#ffffff26";ctx.lineWidth=1;ctx.beginPath();
  for(let i=1;i<COLS;i++){ctx.moveTo(bx+i*s+.5,oy);ctx.lineTo(bx+i*s+.5,oy+bh)}for(let i=1;i<ROWS;i++){ctx.moveTo(bx,oy+i*s+.5);ctx.lineTo(bx+bw,oy+i*s+.5)}ctx.stroke();
  p.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c)block(bx+x*s,oy+y*s,s,COLORS[c])}));
  if(p.active&&!p.remote){if(settings.ghost){const dy=p.ghostY()-p.y;for(const [x,y] of p.cells())if(y+dy>=0){ctx.fillStyle="#ffffff22";ctx.fillRect(bx+x*s+1,oy+(y+dy)*s+1,s-2,s-2);ctx.strokeStyle="#ffffffaa";ctx.lineWidth=2;ctx.strokeRect(bx+x*s+2,oy+(y+dy)*s+2,s-4,s-4)}}
    for(const [x,y] of p.cells())if(y>=0)block(bx+x*s,oy+y*s,s,COLORS[p.kind])}
  boardFrame(bx,oy,bw,bh,p.shake>0?"#ff4d6a":"#fff");
  if(!p.alive||p.done){ctx.fillStyle="#00000066";ctx.fillRect(bx,oy,bw,bh)}
  if(p.glow<1.6){ctx.save();ctx.globalAlpha=(1-p.glow/1.6)*.5;ctx.fillStyle="#45ff8a";ctx.fillRect(bx,oy,bw,bh);ctx.restore()}
  const nx=bx+bw+14;skyBox(nx,oy,side,s*3.6,"Next");mini(p.queue[0],nx+side/2,oy+s*2.3,s*.72);
  skyBox(nx,oy+s*4.4,side,s*10.4,"");p.queue.slice(1,5).forEach((k,i)=>mini(k,nx+side/2,oy+s*6+i*s*2.4,s*.55));
  p._btn={x:nx,y:oy+s*15.6,w:side,h:s*4.4};
  if(p.event&&p.eventAge<1.5){ctx.save();ctx.globalAlpha=Math.min(1,(1.5-p.eventAge)*2);text(p.event,bx+bw/2,oy+bh/2-s*2,Math.max(16,s*.85),"#fff","center","toon");ctx.restore()}}

/* 藍天：板子右下的大顆暫停、靜音按鈕（畫在畫布上，點一下就有作用） */
let canvasBtns=[];
function roundBtn(cx,cy,r,kind,on){const g=ctx.createLinearGradient(0,cy-r,0,cy+r);g.addColorStop(0,"#3aa8ff");g.addColorStop(1,"#1567d3");
  ctx.save();ctx.shadowColor="#0b3d8a88";ctx.shadowBlur=8;ctx.shadowOffsetY=3;rr(cx-r,cy-r,r*2,r*2,r*.45);ctx.fillStyle=g;ctx.fill();ctx.restore();
  rr(cx-r,cy-r,r*2,r*2,r*.45);ctx.lineWidth=2;ctx.strokeStyle="#bfe2ff";ctx.stroke();ctx.fillStyle="#fff";
  if(kind==="pause"){if(on){ctx.beginPath();ctx.moveTo(cx-r*.3,cy-r*.45);ctx.lineTo(cx+r*.45,cy);ctx.lineTo(cx-r*.3,cy+r*.45);ctx.fill()}else{ctx.fillRect(cx-r*.38,cy-r*.45,r*.26,r*.9);ctx.fillRect(cx+r*.12,cy-r*.45,r*.26,r*.9)}}
  else{ctx.beginPath();ctx.moveTo(cx-r*.5,cy-r*.18);ctx.lineTo(cx-r*.25,cy-r*.18);ctx.lineTo(cx+r*.05,cy-r*.45);ctx.lineTo(cx+r*.05,cy+r*.45);ctx.lineTo(cx-r*.25,cy+r*.18);ctx.lineTo(cx-r*.5,cy+r*.18);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=Math.max(2,r*.12);ctx.beginPath();if(on){ctx.moveTo(cx+r*.2,cy-r*.22);ctx.lineTo(cx+r*.56,cy+r*.22);ctx.moveTo(cx+r*.56,cy-r*.22);ctx.lineTo(cx+r*.2,cy+r*.22)}else{ctx.arc(cx+r*.12,cy,r*.38,-.8,.8)}ctx.stroke()}
  canvasBtns.push({kind,x:cx-r,y:cy-r,w:r*2,h:r*2})}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;audio.init();
  for(const b of canvasBtns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){e.preventDefault();if(b.kind==="pause"){if(state==="play"&&match&&!match.over)setPause(!paused)}else{audio.muted=!audio.muted;muteBtn()}}});

/* 藍天的背景：亮藍漸層，後面慢慢飄著模糊的大方塊 */
const floaters=Array.from({length:14},(_,i)=>({k:KINDS[i%7],x:Math.random(),y:Math.random(),r:Math.floor(Math.random()*4),v:.004+Math.random()*.008,rot:Math.random()*6,vr:(Math.random()-.5)*.2,sz:.6+Math.random()*.7}));
function drawSkyBg(dt){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#1ec8ff");g.addColorStop(.5,"#3fa9ff");g.addColorStop(1,"#1a6fe8");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const s=Math.max(24,Math.min(W,H)/11);ctx.save();ctx.filter="blur(5px)";
  for(const f of floaters){f.y-=f.v*(dt||0);f.rot+=f.vr*(dt||0);if(f.y<-.2){f.y=1.15;f.x=Math.random()}
    ctx.save();ctx.translate(f.x*W,f.y*H);ctx.rotate(f.rot);ctx.globalAlpha=.55;const z=s*f.sz;
    for(const [x,y] of SHAPES[f.k][f.r]){ctx.fillStyle=COLORS[f.k];ctx.fillRect((x-1.5)*z,(y-1.5)*z,z-2,z-2)}ctx.restore()}
  ctx.restore();ctx.fillStyle="#ffffff40";for(let i=0;i<40;i++){const x=(i*137.5%100)/100*W,y=(i*61.8%100)/100*H;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}}

function drawPlayer(p,ox,oy,s,name,color,info,mirror){const T=th(),bw=COLS*s,bh=ROWS*s,side=s*4.2;
  if(T.frame==="sky")return drawPlayerSky(p,ox,oy,s,name,color,info);
  const sx=p.shake>0?Math.sin(p.shake*90)*p.shake*14:0;ox+=sx;
  const bx=ox+side+14;p._pos={cx:bx+bw/2,cy:oy+bh/2,meterX:bx-8,bottom:oy+bh};
  // 名牌
  const cardY=oy-s*2.3,cardH=s*1.5;
  if(T.frame){rr(bx-6,cardY,bw+12,cardH,cardH/2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#1d1d2b";ctx.stroke()}
  text(name,bx+bw/2,cardY+cardH/2,Math.max(12,s*.62),T.frame?"#fff":color,"center",T.font==="toon"?"toon":null);
  if(cfg.kind==="battle"||cfg.kind==="attack"){const r=Math.max(5,s*.38);for(let i=0;i<5;i++)star(bx+bw/2+(i-2)*r*2.4,cardY-r-3,r,i<p.ko);
    if(p.ko>5)text(`+${p.ko-5}`,bx+bw/2+3*r*2.4,cardY-r-3,Math.max(10,s*.45),T.gold,"center",T.font)}
  // 暫存、送出行數
  box(ox,oy+s*.6,side,s*3,"HOLD");if(p.hold){ctx.globalAlpha=p.canHold?1:.35;mini(p.hold,ox+side/2,oy+s*2.1,s*.7);ctx.globalAlpha=1}
  if(match.attacks||cfg.kind==="score"){const isScore=cfg.kind==="score";box(ox,oy+s*5.6,side,s*2.6,isScore?"LINES":"SENT");
    text(String(isScore?p.lines:p.sent),ox+side/2,oy+s*6.9,Math.max(14,s*1.1),T.gold,"center",T.font)}
  // KO 徽章
  if(p.koAge!=null&&p.koAge<1.6){const k=Math.min(1,p.koAge*5),r=s*1.3*(k<1?k*1.15:1);ctx.save();ctx.globalAlpha=Math.min(1,(1.6-p.koAge)*2);
    ctx.beginPath();ctx.arc(ox+side/2,oy+s*10.5,r,0,Math.PI*2);ctx.fillStyle="#ff4d6a";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();
    text("KO",ox+side/2,oy+s*10.2,r*.7,"#fff","center",T.font);text(String(p.ko),ox+side/2,oy+s*11.1,r*.45,"#fff","center",T.font);ctx.restore()}
  // 垃圾條
  const inc=Math.min(p.pending.reduce((a,b)=>a+b,0),ROWS);ctx.fillStyle=T.well;ctx.fillRect(bx-11,oy,6,bh);if(inc){ctx.fillStyle="#ff4d6a";ctx.fillRect(bx-11,oy+bh-inc*s,6,inc*s)}
  // 板子
  boardFrame(bx,oy,bw,bh,p.shake>0?"#ff4d6a":color);
  ctx.fillStyle=T.well;ctx.fillRect(bx,oy,bw,bh);ctx.strokeStyle=T.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let i=1;i<COLS;i++){ctx.moveTo(bx+i*s+.5,oy);ctx.lineTo(bx+i*s+.5,oy+bh)}for(let i=1;i<ROWS;i++){ctx.moveTo(bx,oy+i*s+.5);ctx.lineTo(bx+bw,oy+i*s+.5)}ctx.stroke();
  p.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c)block(bx+x*s,oy+y*s,s,COLORS[c])}));
  if(p.active&&!p.remote){if(settings.ghost){const dy=p.ghostY()-p.y;for(const [x,y] of p.cells())if(y+dy>=0){ctx.strokeStyle=COLORS[p.kind];ctx.lineWidth=2;ctx.globalAlpha=.6;ctx.strokeRect(bx+x*s+3,oy+(y+dy)*s+3,s-6,s-6);ctx.globalAlpha=1}}
    for(const [x,y] of p.cells())if(y>=0)block(bx+x*s,oy+y*s,s,COLORS[p.kind])}
  if(!p.alive||p.done){ctx.fillStyle="#000a";ctx.fillRect(bx,oy,bw,bh)}
  if(p.glow<1.6){ctx.save();ctx.globalAlpha=(1-p.glow/1.6)*.5;ctx.fillStyle="#45ff8a";ctx.fillRect(bx,oy,bw,bh);ctx.restore()}
  // 下一個、分數
  const nx=bx+bw+14;box(nx,oy+s*.6,side,s*10.6,"NEXT");p.queue.slice(0,4).forEach((k,i)=>mini(k,nx+side/2,oy+s*.6+s*1.4+i*s*2.6,i?s*.55:s*.72));
  box(nx,oy+s*13,side,s*2.2,"SCORE");text(p.score.toLocaleString(),nx+side/2,oy+s*14.1,Math.max(10,s*.6),T.gold,"center",T.font==="toon"?"toon":"pixel");
  text(info,bx+bw/2,oy+bh+(T.frame?22:16),Math.max(12,s*.52),T.frame?"#14304a":T.text);
  if(p.event&&p.eventAge<1.5){ctx.save();ctx.globalAlpha=Math.min(1,(1.5-p.eventAge)*2);if(!T.frame){ctx.shadowColor="#ffc933";ctx.shadowBlur=12}
    text(p.event,bx+bw/2,oy+bh/2-s*2,Math.max(16,s*.85),T.gold,"center",T.font==="toon"?"toon":null);ctx.restore()}}

/* 手機直式：對手縮成小板子（只有板子、名字、KO 和送出行數） */
function drawSmallBoard(p,x,y,s,name,color){const T=th(),bw=COLS*s,bh=ROWS*s;const sx=p.shake>0?Math.sin(p.shake*90)*p.shake*8:0;x+=sx;
  p._pos={cx:x+bw/2,cy:y+bh/2,meterX:x-5,bottom:y+bh};
  text(name,x+bw/2,y-12,Math.max(11,s*1.1),T.frame==="sky"?"#fff":color,"center",T.font==="toon"?"toon":null);
  ctx.fillStyle=T.frame==="sky"?"#5c8fa8d9":T.well;ctx.fillRect(x,y,bw,bh);
  p.grid.forEach((row,yy)=>row.forEach((c,xx)=>{if(c){ctx.fillStyle=COLORS[c];ctx.fillRect(x+xx*s,y+yy*s,s-1,s-1)}}));
  if(p.active&&!p.remote)for(const [cx,cy] of p.cells())if(cy>=0){ctx.fillStyle=COLORS[p.kind];ctx.fillRect(x+cx*s,y+cy*s,s-1,s-1)}
  const inc=Math.min(p.pending.reduce((a,b)=>a+b,0),ROWS);if(inc){ctx.fillStyle="#ff4d6a";ctx.fillRect(x-5,y+bh-inc*s,3,inc*s)}
  ctx.strokeStyle=p.shake>0?"#ff4d6a":(T.frame==="sky"?"#fff":color);ctx.lineWidth=2;ctx.strokeRect(x-1,y-1,bw+2,bh+2);
  if(!p.alive||p.done){ctx.fillStyle="#000a";ctx.fillRect(x,y,bw,bh)}
  const line=cfg.kind==="score"?`${p.score.toLocaleString()} 分`:cfg.kind==="survival"?`送出 ${p.sent}`:`KO ${p.ko}　送 ${p.sent}`;
  text(line,x+bw/2,y+bh+12,Math.max(10,s*.95),T.frame==="sky"||T.frame?"#fff":"#ece8ff","center");
  if(p.event&&p.eventAge<1.2)text(p.event,x+bw/2,y+bh/2,Math.max(10,s*1.1),T.gold,"center",T.font==="toon"?"toon":null)}

/* 卡通風格的畫布背景：放射光線＋圓點（我們自己的設計） */
function drawToonBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#5db6ea");g.addColorStop(1,"#bfe6f8");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H*.45);ctx.fillStyle="#ffffff1c";for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.max(W,H),-Math.max(W,H)*.12);ctx.lineTo(Math.max(W,H),Math.max(W,H)*.12);ctx.fill()}ctx.restore();
  ctx.fillStyle="#ffffff30";for(let y=12;y<H;y+=36)for(let x=(y/36%2)*18+8;x<W;x+=36){ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}

/* 攻擊動畫：發光的能量球從攻擊者飛到對手的垃圾條 */
function drawShots(dt){if(!match)return;const keep=[];
  for(const sh of match.shots){if(sh.age===0)audio.play("shot");sh.age+=dt;const a=match.players[sh.from]._pos,b=match.players[sh.to]._pos;if(!a||!b)continue;
    const k=Math.min(1,sh.age/.45),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const x=a.cx+(b.meterX-a.cx)*e,y=a.cy+(b.bottom-CELL*2-a.cy)*e-Math.sin(Math.PI*e)*CELL*5,r=CELL*(.45+Math.min(sh.n,10)*.06);
    ctx.save();ctx.shadowColor="#ff3fd0";ctx.shadowBlur=24;ctx.fillStyle="#ff3fd0";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,r*.45,0,Math.PI*2);ctx.fill();ctx.restore();
    text("+"+sh.n,x,y-r-10,Math.max(12,CELL*.6),"#ffc933","center","pixel");
    if(k<1)keep.push(sh);else{audio.play("hit");match.players[sh.to].shake=Math.max(match.players[sh.to].shake,.25)}}
  match.shots=keep}

/* ================= 遊戲狀態 ================= */
const MODES=[
  {key:1,title:"KO 對戰",desc:"限時 2 分鐘，把對手頂到頂得 1 KO；KO > 送出行數 > 行高",cfg:{kind:"battle",time:120,vs:true}},
  {key:2,title:"分數對戰",desc:"限時 2 分鐘比分數，不互相攻擊；頂到頂就停在那個分數",cfg:{kind:"score",time:120,vs:true}},
  {key:3,title:"攻擊對戰",desc:`先送出 ${ATTACK_GOAL} 行攻擊的人贏（最多 3 分鐘）`,cfg:{kind:"attack",time:180,vs:true}},
  {key:4,title:"生死戰",desc:"先被頂到頂的人輸",cfg:{kind:"survival",vs:true}},
  {key:5,title:"Sprint 40 行",desc:"單人，消 40 行比時間",cfg:{kind:"sprint"}},
  {key:6,title:"Marathon",desc:"單人 15 關，越來越快",cfg:{kind:"marathon"}},
];
let state="menu",cfg=null,diff=null,match=null,ais={},names=[],countdown=0,lastBeep=0,paused=false,scored=false,note="",wins=[0,0],waitKey=null;
const held={};

function start(c,d){cfg=c;diff=d;state="play";paused=false;scored=false;note="";
  const n=c.vs?2:1;match=new Match(n,c.kind,c.time||null);ais={};
  if(c.vs&&d===null)names=["玩家 1","玩家 2"];else if(c.vs){ais={1:new AI(DIFFICULTY[d])};names=["你",`電腦（${d}）`]}else names=["你"];
  countdown=settings.countdown?3:0;lastBeep=0;audio.stopMusic();audio.paused=false;if(!countdown){audio.play("go");audio.startMusic()}
  for(const k in held)delete held[k];hidePanel()}

/* 這個按鍵控制哪位玩家的哪個動作：對電腦或單人時，兩組按鍵都給玩家 1 */
function controllers(code){const out=[],two=cfg.vs&&diff===null;
  keys.forEach((m,set)=>{for(const [a] of ACTIONS)if(m[a]===code)out.push([two?set:0,a])});return out}
function act(i,a){const p=match.players[i];if(!p)return;
  if(a==="left"){p.move(-1);held[i]={d:-1,t:0}}else if(a==="right"){p.move(1);held[i]={d:1,t:0}}
  else if(a==="cw")p.rotate(1);else if(a==="ccw")p.rotate(-1);else if(a==="hold")p.doHold();else if(a==="drop")match.hardDrop(i);else if(a==="down")p.soft=true;flush()}
function release(i,a){const p=match&&match.players[i];if(!p)return;if(a==="down")p.soft=false;if((a==="left"&&held[i]&&held[i].d<0)||(a==="right"&&held[i]&&held[i].d>0))delete held[i]}
function flush(){match.players.forEach((p,i)=>{const ev=[...new Set(p.sfx)];p.sfx=[];for(const n of ev){if(ais[i]){if(n==="ko"||n.startsWith("clear")||n==="tspin")audio.play(n)}else if(n!=="warn")audio.play(n)}})}

/* ================= 面板（選單、設定、按鍵、暫停、結算） ================= */
function hidePanel(){panel.hidden=true;panel.innerHTML="";document.body.classList.remove("menu-open")}
function showPanel(html){panel.innerHTML=html;panel.hidden=false;document.body.classList.add("menu-open");const b=panel.querySelector("button");if(b)b.focus({preventScroll:true})}
const kbtn=(k,t,sub,act,val)=>`<li><button type="button" class="${val!=null?"setting":""}" data-act="${act}"><span class="k">${k}</span><span class="t">${t}${sub?`<small>${sub}</small>`:""}</span>${val!=null?`<span class="val">${val}</span>`:""}</button></li>`;
const keyLine=i=>{const m=keys[i];return`${keyName(m.left)} ${keyName(m.right)} 移動　${keyName(m.down)} 軟降　${keyName(m.cw)} 順轉　${keyName(m.ccw)} 逆轉　${keyName(m.drop)} 硬降　${keyName(m.hold)} 暫存`};
function showMenu(){state="menu";match=null;paused=false;audio.stopMusic();
  const extra={5:records.sprint!=null?`　最佳 ${fmt(records.sprint)}`:"",6:records.marathon!=null?`　最佳 ${records.marathon} 行`:"",2:records.score!=null?`　最高 ${records.score.toLocaleString()} 分`:""};

function showDiff(c){state="diff";cfg=c;showPanel(`<div class="card"><h2>${MODES.find(m=>m.cfg===c).title}：選對手</h2><ul class="menu">${Object.keys(DIFFICULTY).map((d,i)=>kbtn(i+1,`對電腦（${d}）`,`電腦每 ${DIFFICULTY[d]} 秒動一次`,"diff"+(i+1))).join("")}${kbtn(4,"雙人同機","同一台鍵盤，玩家 1 對玩家 2","diff4")}</ul><div class="row-btns"><button type="button" data-act="menu">← 返回主選單</button></div><p class="hint">Esc / Backspace 也可以返回</p></div>`)}
function showSettings(){state="settings";showPanel(`<div class="card"><h2>設定</h2><ul class="menu">${ITEMS.map(([k,t],i)=>kbtn(i+1,t,k==="style"?(TRACKS[settings.style]?`by ${TRACKS[settings.style].by}（Pixabay）`:settings.style==="隨機"?"每局從四首音樂檔裡挑一首":"程式即時合成"):"","set"+k,label(k))).join("")}${kbtn(ITEMS.length+1,"按鍵設定","自己按鍵盤決定每個動作用哪個鍵","keys")}</ul><div class="row-btns"><button type="button" data-act="menu">← 返回主選單</button></div><p class="hint">按數字或點一下切換，自動存在這個瀏覽器　Esc / Backspace 也可以返回<br>音樂檔來自 Pixabay：${Object.entries(TRACKS).map(([n,t])=>`${n}（${t.by}）`).join("、")}</p></div>`)}
function showKeys(msg=""){state="keys";const cell=(i,a)=>`<button type="button" data-key="${i}:${a}" class="${waitKey&&waitKey[0]===i&&waitKey[1]===a?"wait":""}">${waitKey&&waitKey[0]===i&&waitKey[1]===a?"請按鍵…":keyName(keys[i][a])}</button>`;
  showPanel(`<div class="card"><h2>按鍵設定</h2><p>點一下要改的按鍵，再按鍵盤上想用的鍵（按 Esc 取消）。同一個鍵已經被別的動作用了，兩個會互換。</p>
    <div class="scroll"><div class="keymap"><span></span><span class="hd">玩家 1</span><span class="hd">玩家 2</span>${ACTIONS.map(([a,t])=>`<span>${t}</span>${cell(0,a)}${cell(1,a)}`).join("")}</div></div>
    ${msg?`<p style="color:var(--amber)">${msg}</p>`:""}
    <div class="row-btns"><button type="button" data-act="keys-reset">恢復預設</button><button type="button" data-act="settings">← 返回設定</button><button type="button" data-act="menu">回主選單</button></div>
    <p class="hint">Esc、P、M、R、Backspace 是暫停、靜音、重來、回選單用的，不能設定。<br>注音輸入法按 Shift 會切中英文，不建議設成 Shift。</p></div>`)}
function showPause(){showPanel(`<div class="card"><div class="big">PAUSE</div><ul class="menu">${kbtn("Esc","返回遊戲","也可以按 P","resume")}${kbtn("R","重新開始","","restart")}${kbtn("⌫","回主選單","Backspace","menu")}</ul></div>`)}
function fmt(t){const m=Math.floor(t/60),s=(t%60).toFixed(2).padStart(5,"0");return`${m}:${s}`}

/* 結算：每位玩家一欄，勝負標籤＋各項數據，最好的數值標亮 */
/* 結算：每位玩家一欄，勝負標籤＋各項數據；判定勝負用的項目排最前面並編號，決定勝負的那一列標亮 */
const STAT={score:["分數",p=>p.score,1],lines:["消行",p=>p.lines,1],sent:["送出攻擊",p=>p.sent,1],recv:["收到攻擊",p=>p.received,0],ko:["KO",p=>p.ko,1],
  deaths:["被擊倒",p=>p.deaths,0],height:["結束時行高",p=>p.height(),0],combo:["最高連擊",p=>Math.max(0,p.maxCombo),1],tetris:["四行消除",p=>p.tetrises,1],
  tspin:["T 轉",p=>p.tspins,1],ppm:["每分鐘方塊",p=>match.elapsed?Math.round(p.pieces/match.elapsed*60):0,1]};
const RULES={battle:["ko","sent","height"],attack:["sent","ko","height"],score:["score","lines"]};   // 依序比，前面一樣才比下一項
const SCORE_ITEMS=[["line1","單行","100 × 等級"],["line2","雙行","300 × 等級"],["line3","三行","500 × 等級"],["line4","四行消除","800 × 等級"],
  ["tspin0","T 轉（沒消行）","400 × 等級"],["tspin1","T 轉單行","800 × 等級"],["tspin2","T 轉雙行","1200 × 等級"],["tspin3","T 轉三行","1600 × 等級"],
  ["b2b","連續四行／T 轉加成","該次的 0.5 倍"],["combo","連擊加分","50 × 連擊數 × 等級"],["perfect","全清","3000 × 等級"],["soft","軟降","每格 1"],["hard","硬降","每格 2"]];
function scoreRows(P){const used=SCORE_ITEMS.filter(([k])=>P.some(p=>p.book[k]));
  const unit=k=>["soft","hard"].includes(k)?"格":"次";
  const rows=used.map(([k,n,rule])=>`<tr><td>${n}<br><small style="color:var(--dim)">${rule}</small></td>${P.map(p=>{const b=p.book[k];return`<td>${b?`${b.n.toLocaleString()} ${unit(k)}<br><b>${b.pts.toLocaleString()}</b>`:"-"}</td>`}).join("")}</tr>`).join("");
  const sum=`<tr class="key"><td>合計</td>${P.map(p=>`<td><b>${p.score.toLocaleString()}</b></td>`).join("")}</tr>`;
  return (rows||`<tr><td colspan="${P.length+1}">這局還沒有得分</td></tr>`)+sum}
function showResult(){const m=match,P=m.players,two=P.length===2;let head;
  if(cfg.kind==="sprint")head=m.success?`完成！${fmt(m.finish[0])}`:"挑戰失敗";
  else if(cfg.kind==="marathon")head=m.success?"15 關全破！":`消了 ${P[0].lines} 行`;
  else if(m.winner===-1)head="平手";
  else if(ais[1]||m.net)head=m.winner===0?"你贏了！":"你輸了";
  else head=`${names[m.winner]} 獲勝！`;
  const tag=i=>!two?"":m.winner===-1?'<span class="tag draw">平手</span>':m.winner===i?'<span class="tag win">勝利</span>':'<span class="tag lose">落敗</span>';
  const rule=two?(RULES[cfg.kind]||[]):[];
  // 找出決定勝負的那一項
  let keyStat=null,why="";
  for(const k of rule){const [,f]=STAT[k];if(f(P[0])!==f(P[1])){keyStat=k;break}}
  if(two&&keyStat&&(m.winner===0||m.winner===1)){const [n,f,hi]=STAT[keyStat],w=m.winner,l=1-w,ord=rule.indexOf(keyStat);
    const prev=rule.slice(0,ord).map(k=>`${STAT[k][0]}一樣`).join("、");
    why=`${prev?prev+"，所以比"+n+"。":""}決勝關鍵：${n} ${names[w]} ${f(P[w]).toLocaleString()} ${hi?">":"<"} ${names[l]} ${f(P[l]).toLocaleString()}${hi?"":"（越低越好）"}`}
  else if(two&&cfg.kind==="survival"&&m.winner!==-1)why=`決勝關鍵：${names[1-m.winner]} 先被頂到頂`;
  else if(two&&m.winner===-1)why="每一項判定都一樣，算平手";
  const ruleText={battle:"KO 對戰的判定：① KO 多的贏 → ② 送出攻擊多的贏 → ③ 結束時行高低的贏（分數不算）",
    attack:`攻擊對戰的判定：先送出 ${ATTACK_GOAL} 行的人贏；時間到就 ① 送出攻擊 → ② KO → ③ 行高`,
    score:"分數對戰的判定：① 分數高的贏 → ② 消行多的贏",survival:"生死戰的判定：先被頂到頂的人輸（分數不算）"}[cfg.kind]||"";
  let order=[...rule,"score","lines","sent","recv","ko","deaths","combo","tetris","tspin","ppm"].filter((k,i,a)=>a.indexOf(k)===i);
  if(!two)order=order.filter(k=>!["sent","recv","ko","deaths","height"].includes(k));
  if(!["battle","attack"].includes(cfg.kind))order=order.filter(k=>!["ko","deaths"].includes(k));
  const body=order.map(k=>{const [n,f,hi]=STAT[k],v=P.map(f),best=two&&v[0]!==v[1]?(hi?Math.max(...v):Math.min(...v)):null,no=rule.indexOf(k);
    return`<tr class="${k===keyStat?"key":""}"><td>${no>=0?`<span class="no">判定${"①②③"[no]}</span>`:""}${n}</td>${v.map(x=>`<td style="${x===best?"color:var(--amber)":""}">${x.toLocaleString()}</td>`).join("")}</tr>`}).join("");
  const extra=[];if(note)extra.push(note);if(two&&cfg.kind==="survival")extra.push(`本次戰績 ${wins[0]} : ${wins[1]}`);
  extra.push(`用時 ${fmt(m.elapsed)}`);
  showPanel(`<div class="card"><div class="big">${head}</div>${why?`<p class="why">${why}</p>`:""}${ruleText?`<p style="text-align:center">${ruleText}</p>`:""}
    <div class="scroll"><table class="result"><thead><tr><th></th>${P.map((_,i)=>`<th>${names[i]}<br>${tag(i)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <h2 style="font-size:16px">分數明細</h2>
    <div class="scroll"><table class="result"><thead><tr><th>項目（每次的分數）</th>${P.map((_,i)=>`<th>${names[i]}</th>`).join("")}</tr></thead><tbody>${scoreRows(P)}</tbody></table></div>
    <details class="how"><summary>分數怎麼算？</summary>消 1／2／3／4 行：100／300／500／800 分 × 等級；T 轉（沒消行 400，消 1／2／3 行 800／1200／1600）× 等級；
      連擊每次再加 50 × 連擊數 × 等級；連續四行或連續 T 轉 × 1.5；全清再加 3000 × 等級；軟降每格 1 分、硬降每格 2 分。
      只有「分數對戰」用分數判勝負，其他模式分數只是參考。</details>
    ${extra.map(l=>`<p style="text-align:center">${l}</p>`).join("")}
    <ul class="menu">${m.net?(NET.host?kbtn("R","再來一局（同模式）","對手會一起開始","restart")+kbtn("M","換模式","回房間選模式","net-room"):`<li><p class="hint">等房主開下一局…</p></li>`)+kbtn("⌫","離開房間","","net-leave"):kbtn("R","再來一局","空白鍵 / Enter 也可以","restart")+kbtn("⌫","回主選單","Esc / Backspace","menu")}</ul></div>`)}

panel.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;audio.init();
  if(b.dataset.key){const [i,a]=b.dataset.key.split(":");waitKey=[+i,a];showKeys();return}
  if(b.dataset.act)handle(b.dataset.act)});
function handle(a){
  if(a.startsWith("mode")){const m=MODES.find(x=>x.key===+a.slice(4));if(m.cfg.vs)showDiff(m.cfg);else start(m.cfg,"普通")}
  else if(a==="online")showOnline();else if(a==="net-create")netCreate();else if(a==="net-join")netJoin();
  else if(a.startsWith("net-mode"))netHostStart(+a.slice(8));else if(a==="net-room")showRoom();else if(a==="net-leave"){netLeave();showMenu()}
  else if(a==="settings"){waitKey=null;showSettings()}else if(a==="keys")showKeys();
  else if(a==="keys-reset"){keys=DEFAULT_KEYS.map(k=>Object.assign({},k));save("taco-blocks-keys",keys);waitKey=null;showKeys("已恢復預設按鍵")}
  else if(a.startsWith("diff")){const n=+a.slice(4);start(cfg,n===4?null:Object.keys(DIFFICULTY)[n-1])}
  else if(a.startsWith("set")){const k=a.slice(3);toggleSetting(k);if(k==="style"||k==="music"){audio.stopMusic();if(settings.music){audio.startMusic();clearTimeout(audio.preview);audio.preview=setTimeout(()=>{if(state!=="play")audio.stopMusic()},6000)}}showSettings()}
  else if(a==="resume")setPause(false);else if(a==="restart"){if(match&&match.net){if(NET.host)netHostStart(NET.modeKey)}else start(cfg,diff)}else if(a==="menu"){paused=false;showMenu()}}
function setPause(v){if(state!=="play"||match.over||match.net)return;paused=v;audio.paused=v;if(v){for(const k in held)delete held[k];match.players.forEach(p=>p.soft=false);showPause()}else hidePanel()}
function bindKey(code){const [i,a]=waitKey;waitKey=null;
  if(code==="Escape"){showKeys();return}
  if(RESERVED.includes(code)){showKeys(`「${keyName(code)}」是系統用的鍵，請換一個`);return}
  const old=keys[i][a];let swapped="";
  keys.forEach((m,j)=>{for(const [b,t] of ACTIONS)if(m[b]===code&&!(j===i&&b===a)){m[b]=old;swapped=`（和玩家 ${j+1} 的「${t}」互換）`}});
  keys[i][a]=code;save("taco-blocks-keys",keys);showKeys(`玩家 ${i+1}「${ACTIONS.find(x=>x[0]===a)[1]}」改成 ${keyName(code)} ${swapped}`)}

/* ================= 鍵盤：用實體按鍵位置（e.code），注音輸入法開著也能玩 ================= */
const digitOf=c=>{const m=/^(?:Digit|Numpad)(\d)$/.exec(c);return m?+m[1]:null};
window.addEventListener("keydown",e=>{audio.init();const c=e.code,d=digitOf(c);
  if(state==="keys"&&waitKey){e.preventDefault();bindKey(c);return}
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Backspace","Slash","Tab"].includes(c))e.preventDefault();
  if(c==="KeyM"){audio.muted=!audio.muted;muteBtn();return}
  if(state==="menu"){if(d===0)showSettings();else if(d===7)showOnline();else if(d&&MODES.some(x=>x.key===d))handle("mode"+d);return}
  if(state==="online"||state==="room"){if((c==="Escape"||c==="Backspace")&&!(e.target&&e.target.tagName==="INPUT")){netLeave();showMenu()}else if(state==="room"&&NET.host&&d>=1&&d<=4&&NET.opp)netHostStart(d);return}
  if(state==="diff"){if(c==="Escape"||c==="Backspace")showMenu();else if(d>=1&&d<=4)handle("diff"+d);return}
  if(state==="settings"){if(c==="Escape"||c==="Backspace")showMenu();else if(d>=1&&d<=ITEMS.length)handle("set"+ITEMS[d-1][0]);else if(d===ITEMS.length+1)showKeys();return}
  if(state==="keys"){if(c==="Escape"||c==="Backspace")showSettings();return}
  if(state!=="play")return;
  if(match.over){if(["Space","Enter","NumpadEnter","KeyR"].includes(c)){if(match.net){if(NET.host)netHostStart(NET.modeKey)}else start(cfg,diff)}else if(c==="Escape"||c==="Backspace")showMenu();return}
  if(c==="Escape"||c==="KeyP"){setPause(!paused);return}
  if(paused){if(c==="KeyR")start(cfg,diff);else if(c==="Backspace"){paused=false;showMenu()}return}
  if(countdown>0||e.repeat)return;
  for(const [i,a] of controllers(c)){if(ais[i])continue;e.preventDefault();act(i,a)}});
window.addEventListener("keyup",e=>{if(state!=="play"||!match)return;for(const [i,a] of controllers(e.code))release(i,a)});
window.addEventListener("blur",()=>{if(state==="play"&&match&&!match.net&&!match.over&&!paused)setPause(true)});

document.querySelectorAll("#touch button").forEach(b=>{const a=b.dataset.a;
  const down=e=>{e.preventDefault();audio.init();if(state!=="play"||paused||match.over||countdown>0)return;act(0,a);b.setPointerCapture?.(e.pointerId)};
  const up=e=>{e.preventDefault();if(state==="play"&&match)release(0,a)};
  b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up)});
document.getElementById("btn-pause").addEventListener("click",()=>{if(state==="play"&&!match.over)setPause(!paused)});
document.getElementById("btn-menu").addEventListener("click",()=>{audio.init();waitKey=null;
  if(state==="play"&&match&&match.net){netLeave();showMenu()}       // 線上對戰沒辦法暫停：直接離開（算棄權）
  else if(state==="play"&&match&&!match.over&&!paused)setPause(true);   // 玩到一半先暫停，暫停畫面裡有「回主選單」
  else if(state!=="menu"){if(state==="online"||state==="room")netLeave();paused=false;showMenu()}});
const mb=document.getElementById("btn-mute");function muteBtn(){mb.textContent=audio.muted?"取消靜音 M":"靜音 M"}
mb.addEventListener("click",()=>{audio.init();audio.muted=!audio.muted;muteBtn()});

/* ================= 線上對戰：用 room 的「presence」互傳自己的狀態 =================
   每個人只模擬自己的板子，把畫面（板子、分數、送出的總攻擊行數…）放在自己的 presence；
   對手的「送出總行數」變多了，多出來的就是打過來的垃圾行。房主決定模式、方塊順序（seed）和開始時間。 */
const NET={api:null,room:null,code:null,host:false,opp:null,round:0,seen:0,sent:0,startAt:0,modeKey:1,lastPub:0,evn:0,unsub:null,
  nick:(()=>{try{return localStorage.getItem("taco-blocks-nick")||""}catch(e){return""}})()};

/* PeerJS 版連線：不用登入，房主用「taco-blocks-房號」當自己的代號，朋友直接連過去。
   做成跟 room 一樣的樣子（join / onPeers / presence / leave），下面的對戰程式完全不用改。 */
const PEER_PREFIX="taco-blocks-v1-";
const peerApi={join:(name,host)=>new Promise((res,rej)=>{
  const id=PEER_PREFIX+name;let peer;
  try{peer=host?new Peer(id,{debug:0}):new Peer({debug:0})}catch(e){rej({code:"no_peer"});return}
  let conn=null,theirs=null,mine=null,peersFn=null,discFn=null,done=false,closed=false;
  const emit=()=>{if(peersFn)peersFn({peers:conn&&conn.open&&theirs?[{peer:conn.peer,presence:theirs,sameTab:false}]:[]})};
  const wire=c=>{if(host&&conn&&conn.open){c.on("open",()=>c.close());return}
    conn=c;theirs=null;
    c.on("open",()=>{if(mine)try{c.send(mine)}catch(e){}emit()});
    c.on("data",d=>{if(d&&typeof d==="object"){theirs=d;emit()}});
    c.on("close",()=>{if(conn!==c)return;conn=null;theirs=null;emit();if(!host&&!closed&&discFn&&state==="room")discFn()});
    c.on("error",()=>{})};
  const room={onPeers(fn,onDisc){peersFn=fn;discFn=onDisc||null;emit();return()=>{peersFn=null;discFn=null}},
    presence(p){mine=p;if(conn&&conn.open)try{conn.send(p)}catch(e){}return Promise.resolve()},
    leave(){closed=true;try{peer.destroy()}catch(e){}return Promise.resolve()}};
  const fail=code=>{if(done)return;done=true;closed=true;try{peer.destroy()}catch(e){}rej({code})};
  const timer=setTimeout(()=>fail("timeout"),12000);
  peer.on("open",()=>{if(host){done=true;clearTimeout(timer);res(room);return}
    const c=peer.connect(id,{reliable:true,serialization:"json"});wire(c);
    c.on("open",()=>{if(!done){done=true;clearTimeout(timer);res(room)}})});
  if(host)peer.on("connection",wire);
  peer.on("error",e=>{if(!done){clearTimeout(timer);fail(e&&e.type)}});
  peer.on("disconnected",()=>{if(!closed)try{peer.reconnect()}catch(e){}});
})};
if(window.Peer)NET.api=peerApi;
(async()=>{if(NET.api)return;try{if(window.claude&&claude.use)NET.api=await claude.use("room")}catch(e){NET.api=null}if(state==="online")showOnline()})();
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const oppName=()=>NET.opp?String(NET.opp.presence.nick||"對手").slice(0,12):"對手";
function showOnline(msg=""){state="online";
  if(!NET.api){showPanel(`<div class="card"><h2>線上對戰</h2><p>連線元件載入不了，請確認有網路後重新整理頁面再試一次。</p><div class="row-btns"><button type="button" data-act="menu">← 返回主選單</button></div></div>`);return}
  showPanel(`<div class="card"><h2>線上對戰</h2><p>你建立房間會拿到一組房號，朋友在他的手機或電腦打開這個遊戲，輸入同一組房號就能對打。</p>
    <label class="hint" for="net-nick" style="text-align:left">你的暱稱</label><div class="field"><input id="net-nick" maxlength="12" value="${esc(NET.nick)}" placeholder="例如：taco"></div>
    <ul class="menu">${kbtn("1","建立房間","你當房主，選模式、按開始","net-create")}</ul>
    <label class="hint" for="net-code" style="text-align:left">或輸入朋友的房號加入</label>
    <div class="field"><input id="net-code" inputmode="numeric" maxlength="4" placeholder="4 位數"><button type="button" data-act="net-join">加入</button></div>
    ${msg?`<p style="color:var(--amber)">${esc(msg)}</p>`:""}
    <div class="row-btns"><button type="button" data-act="menu">← 返回主選單</button></div>
    <p class="hint">不用登入：把這個網址傳給朋友，輸入同一組房號就好。連線時沒辦法暫停。少數公司或學校網路可能連不上，換手機網路試試。</p></div>`);
  const nk=document.getElementById("net-nick");if(nk)nk.addEventListener("input",()=>{NET.nick=nk.value.trim();try{localStorage.setItem("taco-blocks-nick",NET.nick)}catch(e){}})}
function myNick(){return(NET.nick||"玩家").slice(0,12)}
async function netEnter(code,host,quiet){try{NET.room=await NET.api.join("taco-"+code,host)}catch(e){const c=e&&e.code;if(quiet&&c==="unavailable-id")return"taken";
    showOnline(c==="limit_reached"?"房間太多了，等一下再試":c==="peer-unavailable"?"找不到這個房號，確認朋友的房間還開著":c==="timeout"?"連線逾時，請再試一次":"連不上房間，請再試一次");return false}
  Object.assign(NET,{code,host,opp:null,round:0,seen:0,sent:0});
  NET.unsub=NET.room.onPeers(ch=>{const others=ch.peers.filter(p=>!p.sameTab);
      const keep=others.find(p=>NET.opp&&p.peer===NET.opp.peer)||others.find(p=>p.presence.role===(host?"guest":"host"))||null;
      const wasPlaying=NET.opp&&!keep&&state==="play"&&match&&match.net&&!match.over;NET.opp=keep;
      if(wasPlaying){netFinish(0,"對手離開了房間");return}
      if(!host&&keep)netGuestCheck();if(state==="room")showRoom()},
    ()=>{if(state==="room"||(state==="play"&&match&&match.net)){netLeave();showOnline("連線中斷了")}});
  netPublish(true);return true}
async function netCreate(){audio.init();showPanel(`<div class="card"><h2>線上對戰</h2><p>建立房間中…</p></div>`);
  for(let i=0;i<5;i++){const code=String(1000+Math.floor(Math.random()*9000));const r=await netEnter(code,true,i<4);if(r==="taken")continue;if(r)showRoom();return}}
async function netJoin(){audio.init();const v=(document.getElementById("net-code")?.value||"").replace(/\D/g,"");if(v.length!==4){showOnline("房號是 4 位數字");return}
  showPanel(`<div class="card"><h2>線上對戰</h2><p>連線到房間 ${esc(v)}…</p></div>`);
  if(await netEnter(v,false))showRoom()}
function netLeave(){if(NET.unsub){NET.unsub();NET.unsub=null}if(NET.room){NET.room.leave().catch(()=>{});NET.room=null}NET.opp=null;NET.code=null;if(match&&match.net)match=null}
function showRoom(){state="room";if(match&&match.net&&!match.over)return;
  const opp=NET.opp?`<span class="dot on"></span>${esc(oppName())} 已加入`:`<span class="dot"></span>等朋友加入…`;
  const modes=MODES.filter(m=>m.cfg.vs).map(m=>kbtn(m.key,m.title,m.desc,"net-mode"+m.key)).join("");
  showPanel(`<div class="card"><h2>房間</h2><div class="code">${esc(NET.code)}</div><p style="text-align:center">把這組房號告訴朋友<br>你是 ${esc(myNick())}${NET.host?"（房主）":""}</p>
    <p style="text-align:center">${opp}</p>
    ${NET.host?(NET.opp?`<p>選一個模式就開始：</p><ul class="menu">${modes}</ul>`:""):`<p class="hint">等房主選模式開始…</p>`}
    <div class="row-btns"><button type="button" data-act="net-leave">離開房間</button></div></div>`)}
function netHostStart(key){if(!NET.host||!NET.opp)return;const m=MODES.find(x=>x.key===key&&x.cfg.vs);if(!m)return;
  NET.round++;NET.modeKey=key;const seed=Math.floor(Math.random()*2**30),startAt=Date.now()+3500;
  NET.game={round:NET.round,seed,mode:key,startAt};netBegin(NET.game);netPublish(true)}
function netGuestCheck(){const g=NET.opp&&NET.opp.presence.game;if(!g||!(g.round>NET.round))return;
  if(Date.now()-g.startAt>8000)return;   // 錯過太久的局就不追了，等下一局
  NET.round=g.round;NET.modeKey=g.mode;netBegin(g)}
function netBegin(g){const m=MODES.find(x=>x.key===g.mode);cfg=m.cfg;diff="net";state="play";paused=false;scored=false;note="";
  match=new Match(2,cfg.kind,cfg.time||null,g.seed);match.net=true;match.startAt=g.startAt;ais={};
  const r=match.players[1];r.remote=true;r.queue=[];
  names=[myNick(),oppName()];NET.seen=0;NET.sent=0;NET.evn=0;NET.lastEv="";
  countdown=Math.max(.5,(g.startAt-Date.now())/1000);lastBeep=0;audio.stopMusic();audio.paused=false;for(const k in held)delete held[k];hidePanel()}
/* 把對手 presence 裡的狀態套到畫面上的第 2 位玩家；多出來的送出行數 = 打過來的垃圾 */
function netApplyRemote(m){const o=NET.opp,s=o&&o.presence.st;if(!s||s.round!==NET.round)return;const r=m.players[1],me=m.players[0];
  if(typeof s.grid==="string"&&s.grid.length===COLS*ROWS)r.grid=Array.from({length:ROWS},(_,y)=>Array.from({length:COLS},(_,x)=>{const c=s.grid[y*COLS+x];return COLORS[c]?c:null}));
  r.score=+s.score||0;r.lines=+s.lines||0;r.sent=+s.sent||0;r.deaths=+s.deaths||0;r.alive=s.alive!==false;r.done=!!s.done;
  r.hold=COLORS[s.hold]?s.hold:null;r.queue=String(s.next||"").split("").filter(k=>SHAPES[k]).slice(0,5);r.pending=s.pend?[+s.pend]:[];
  r.maxCombo=+s.combo||0;r.tetrises=+s.tet||0;r.tspins=+s.ts||0;r.pieces=+s.pc||0;r.received=+s.recv||0;r.book=s.book&&typeof s.book==="object"?s.book:{};
  if(s.evn!==r._evn){r._evn=s.evn;if(s.ev){r.event=String(s.ev).slice(0,20);r.eventAge=0}}
  me.ko=r.deaths;r.ko=me.deaths;
  if(m.attacks&&r.sent>NET.seen){const d=r.sent-NET.seen;NET.seen=r.sent;me.receive(d,1);m.shots.push({from:1,to:0,n:d,age:0})}
  r._h=+s.h||0;r._over=!!s.over}
function netAfterLocal(m){const me=m.players[0],o=me.outbox;me.outbox=0;me.sent=NET.sent+o;if(o&&m.attacks){NET.sent+=o;m.shots.push({from:0,to:1,n:o,age:0})}}
function netUpdate(m,dt){const me=m.players[0],r=m.players[1];
  if(m.ending){netApplyRemote(m);netPublish(false,true);if(r._over||Date.now()-m.ending>1500){netApplyRemote(m);m.end(m.sortBy())}return}
  m.elapsed=Math.max(0,(Date.now()-m.startAt)/1000);
  netApplyRemote(m);me.update(dt);r.eventAge+=dt;r.glow+=dt;r.shake=Math.max(0,r.shake-dt);netAfterLocal(m);
  if(["battle","attack"].includes(m.mode)&&!me.alive){me.deaths++;me.ev("被擊倒");me.revive()}
  me.ko=r.deaths;r.ko=me.deaths;
  if(m.mode==="survival"){if(!me.alive)return netFinish(1);if(!r.alive)return netFinish(0)}
  if(m.mode==="attack"&&(me.sent>=ATTACK_GOAL||r.sent>=ATTACK_GOAL))return netFinish(null);
  if(m.mode==="score"&&!me.alive&&!r.alive)return netFinish(null);
  if(m.timeUp())netFinish(null);
  netPublish(false)}
function netFinish(winner,why){const m=match;if(!m||m.over||m.ending)return;
  if(winner==null){m.ending=Date.now();netPublish(true,true)}else{netPublish(true,true);m.over=true;m.winner=winner}
  if(why)note=why}
function netPublish(force,over){if(!NET.room)return;const now=performance.now();if(!force&&now-NET.lastPub<60)return;NET.lastPub=now;
  const pres={nick:myNick(),role:NET.host?"host":"guest",game:NET.host?NET.game||null:null,st:null};
  if(match&&match.net){const me=match.players[0];const g=me.grid.map(r=>r.slice());if(me.active)for(const [x,y] of me.cells())if(y>=0&&y<ROWS)g[y][x]=me.kind;
    if(me.event!==NET.lastEv){NET.lastEv=me.event;NET.evn++}
    pres.st={round:NET.round,grid:g.map(r=>r.map(c=>c||".").join("")).join(""),score:me.score,lines:me.lines,sent:NET.sent,deaths:me.deaths,alive:me.alive,done:me.done,
      hold:me.hold||"",next:me.queue.slice(0,5).join(""),pend:me.pending.reduce((a,b)=>a+b,0),combo:Math.max(0,me.maxCombo),tet:me.tetrises,ts:me.tspins,pc:me.pieces,recv:me.received,
      book:me.book,h:me.height(),ev:me.eventAge<1.5?me.event:"",evn:NET.evn,over:!!(over||match.over||match.ending)}}
  NET.room.presence(pres).catch(()=>{})}

/* ================= 主迴圈 ================= */
let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;
  if(state==="play"&&!paused&&match){
    if(countdown>0){countdown-=dt;const b=countdown>0?Math.ceil(countdown):0;if(b!==lastBeep){audio.play(b?"count":"go");if(!b)audio.startMusic();lastBeep=b}}
    else if(!match.over){const [das,arr]=SPEEDS[settings.speed];
      for(const i in held){const h=held[i];h.t+=dt;while(h.t>=das+arr){h.t-=arr;match.players[i].move(h.d)}}
      for(const i in ais)ais[i].update(dt,match.players[i],match,+i);match.update(dt);flush()}
    if(match.over&&!scored){scored=true;audio.stopMusic();const m=match;
      if(cfg.kind==="sprint"&&m.success&&(records.sprint==null||m.finish[0]<records.sprint)){records.sprint=+m.finish[0].toFixed(2);note="新紀錄！"}
      if(cfg.kind==="marathon"&&(records.marathon==null||m.players[0].lines>records.marathon)){records.marathon=m.players[0].lines;note="新紀錄！"}
      if(cfg.kind==="score"&&(records.score==null||m.players[0].score>records.score)&&!(diff===null)){records.score=m.players[0].score;note="新的最高分！"}
      save("taco-blocks-records",records);
      if(m.players.length===2&&(m.winner===0||m.winner===1))wins[m.winner]++;
      audio.play(m.winner===0||m.success||(diff===null&&m.winner===1)?"win":"dead");setTimeout(()=>{if(state==="play"&&match===m)showResult()},1000)}}
  render(dt);requestAnimationFrame(frame)}

const GOALS={battle:"2 分鐘內盡量把對手頂到頂（KO）",score:"2 分鐘內拿最高分",attack:`先送出 ${ATTACK_GOAL} 行攻擊`,survival:"別被頂到頂，撐到對手倒下",sprint:"盡快消掉 40 行",marathon:"撐過 15 關"};
function render(dt){ctx.clearRect(0,0,W,H);const T=th();canvasBtns=[];
  if(T.frame==="sky")drawSkyBg(dt);else if(T.frame)drawToonBg();
  if(!match){if(T.frame!=="sky")drawAttract();return}
  const n=match.players.length,pad=22,unitW=(4.2*2+COLS)+2,unitH=ROWS+6.2,gap=n>1?Math.max(30,W*.06):0;
  let ox,oy,cx;
  const wide=Math.floor(Math.min((W-pad*2-(n-1)*gap)/(unitW*n),(H-pad)/unitH));
  const compact=n===2&&wide<15;   // 兩個完整板子放不下（手機直式）
  if(compact){
    // 自己的板子用掉大部分寬度，右邊留一條給對手的小板子
    const smallW=COLS*.48+1.2;CELL=Math.floor(Math.min((W-16)/(unitW+smallW),(H-pad)/unitH));CELL=Math.max(8,Math.min(CELL,32));
    const total=(unitW+smallW)*CELL;ox=Math.max(4,(W-total)/2);oy=(H-ROWS*CELL)/2+CELL*1.8;
    const p0=match.players[0];drawPlayer(p0,ox,oy,CELL,names[0],T.tints[0],({battle:`KO ${p0.ko}　送出 ${p0.sent}`,attack:`送出 ${p0.sent} / ${ATTACK_GOAL}`,score:`消行 ${p0.lines}`,survival:`送出 ${p0.sent}`}[cfg.kind]||""));
    const ss=Math.max(4,Math.floor(CELL*.48));drawSmallBoard(match.players[1],ox+unitW*CELL+CELL*.4,oy+CELL*1.2,ss,names[1],T.tints[1]);
    cx=ox+(unitW*CELL)/2;
  }else{
    CELL=Math.max(8,Math.min(wide,32));
    const total=n*unitW*CELL+(n-1)*gap;ox=(W-total)/2;oy=(H-ROWS*CELL)/2+CELL*1.8;
    match.players.forEach((p,i)=>{const info={battle:`KO ${p.ko}　送出 ${p.sent}`,attack:`送出 ${p.sent} / ${ATTACK_GOAL}`,score:`消行 ${p.lines}`,survival:`送出 ${p.sent}`}[cfg.kind]||`消行 ${p.lines}　等級 ${Math.min(p.level,MAX_LEVEL)}`;
      drawPlayer(p,ox+i*(unitW*CELL+gap),oy,CELL,names[i],T.tints[i],info,i===1)});
    cx=n===2?ox+unitW*CELL+gap/2:W/2;
  }
  drawShots(paused?0:dt);
  if(T.frame==="sky"){const last=match.players[compact?0:n-1]._btn;if(last){const r=Math.min(last.w/4.6,CELL*1.15);roundBtn(last.x+last.w/2-r*1.15,last.y+last.h-r,r,"pause",paused);roundBtn(last.x+last.w/2+r*1.15,last.y+last.h-r,r,"mute",audio.muted)}}
  // 上方正中央的計時器
  let hud="",lab="TIME";const t=match.timeLeft;
  if(t!=null){const s=Math.ceil(t);hud=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
  if(cfg.kind==="sprint"){hud=fmt(match.elapsed);lab=`剩 ${Math.max(0,40-match.players[0].lines)} 行`}
  else if(cfg.kind==="marathon"){const p=match.players[0];hud=`${Math.min(p.level,MAX_LEVEL)}/${MAX_LEVEL}`;lab="LEVEL"}
  else if(cfg.kind==="survival"&&n===2){hud=`${wins[0]} : ${wins[1]}`;lab="WINS"}
  const cy=Math.max(26,oy-CELL*3.6),fs=Math.max(16,CELL*.95),pw=Math.max(110,fs*4.6),ph=fs*1.7;
  if(hud){if(T.frame==="sky"){skyBox(cx-pw/2,cy-ph/2,pw,ph,"")}else if(T.frame){rr(cx-pw/2,cy-ph/2,pw,ph,ph/2);ctx.fillStyle="#1d1d2b";ctx.fill();rr(cx-pw/2+4,cy-ph/2+4,pw-8,ph-8,ph/2-4);ctx.fillStyle="#fff7d6";ctx.fill()}
    text(lab,cx,cy-ph/2-8,Math.max(10,CELL*.45),T.frame==="sky"?"#fff":T.frame?"#14304a":T.label,"center",T.font);
    text(hud,cx,cy+1,fs,t!=null&&t<=10?"#ff4d6a":(T.frame==="sky"?"#fff":T.frame?"#ff8a1f":T.gold),"center",T.font)}
  if(cfg.kind==="attack"&&n===2){const bw=Math.min(200,W*.22),x=cx-bw/2,y=cy+ph/2+8;
    match.players.forEach((p,i)=>{ctx.fillStyle=T.well;ctx.fillRect(x,y+i*9,bw,6);ctx.fillStyle=T.tints[i];ctx.fillRect(x,y+i*9,bw*Math.min(1,p.sent/ATTACK_GOAL),6)})}
  // 倒數：數字＋這局的目標
  if(countdown>0){const by=oy+ROWS*CELL/2,bw2=Math.min(W-40,CELL*16),bh2=CELL*6.5;ctx.save();
    if(T.frame){rr(W/2-bw2/2,by-bh2/2,bw2,bh2,18);ctx.fillStyle="#1d1d2bee";ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#ffd23f";ctx.stroke()}
    else{ctx.fillStyle="#0b0920dd";ctx.fillRect(W/2-bw2/2,by-bh2/2,bw2,bh2);ctx.strokeStyle="#ff3fd0";ctx.lineWidth=2;ctx.strokeRect(W/2-bw2/2,by-bh2/2,bw2,bh2)}
    text("GOAL",W/2,by-bh2/2+CELL*.9,Math.max(12,CELL*.6),T.gold,"center",T.font);
    text(GOALS[cfg.kind]||"",W/2,by-bh2/2+CELL*1.9,Math.max(13,CELL*.62),"#fff");
    if(!T.frame){ctx.shadowColor="#ffc933";ctx.shadowBlur=20}text(String(Math.ceil(countdown)),W/2,by+CELL*1.2,CELL*2.6,T.gold,"center",T.font==="toon"?"toon":"pixel");ctx.restore()}}

const rain=Array.from({length:22},()=>({k:KINDS[Math.floor(Math.random()*7)],x:Math.random(),y:Math.random(),v:.03+Math.random()*.05,r:Math.floor(Math.random()*4)}));
function drawAttract(){const s=Math.max(14,Math.min(W,H)/24);
  for(const d of rain){d.y+=d.v/60;if(d.y>1.1){d.y=-.1;d.x=Math.random()}
    ctx.globalAlpha=.35;for(const [x,y] of SHAPES[d.k][d.r])block(d.x*W+x*s,d.y*H+y*s,s,COLORS[d.k]);ctx.globalAlpha=1}}

applyTheme();showMenu();requestAnimationFrame(frame);
</script>
