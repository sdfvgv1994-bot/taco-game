<script>
// 之前在這個網址註冊過的 service worker 收掉，再轉到新網址
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith("/player/")) r.unregister(); })).catch(() => {});

</script>
